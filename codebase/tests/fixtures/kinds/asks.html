<!doctype html>
<html><head><meta charset="utf-8"><title>Asks of every form</title>
<link rel="stylesheet" href="/static/kit/kit.css">
</head><body><div class="page">
<h1>Asks of every form</h1>

<canvas-ask data-canvas-id="a-yesno"><script type="application/json">{"form": "yesno", "question": "Is the bed clean?", "context": "Check before the next run."}</script></canvas-ask>

<canvas-ask data-canvas-id="a-one"><script type="application/json">{"question": "Which infill pattern for the bracket?", "context": "Both print in about 4 h.", "options": [{"id": "lines", "label": "Lines", "description": "prints faster"}, {"id": "gyroid", "label": "Gyroid", "description": "stiffer"}, "cubic"], "recommended": "gyroid"}</script></canvas-ask>

<canvas-ask data-canvas-id="a-several"><script type="application/json">{"form": "several", "question": "Which materials may I order?", "options": ["PLA", "PETG", "ASA", "TPU"]}</script></canvas-ask>

<canvas-ask data-canvas-id="a-text"><script type="application/json">{"form": "text", "question": "What should the part be called?"}</script></canvas-ask>

<canvas-ask data-canvas-id="a-number"><script type="application/json">{"form": "number", "question": "Wall thickness?", "min": 0, "max": 20, "unit": "mm", "step": 0.5}</script></canvas-ask>

<canvas-ask data-canvas-id="a-confirm"><script type="application/json">{"form": "confirm", "question": "Keep the 0.4 mm nozzle?", "default": "0.4 mm nozzle"}</script></canvas-ask>

<canvas-ask data-canvas-id="a-default"><script type="application/json">{"question": "Print orientation?", "options": ["flat", "upright"], "default": "flat"}</script></canvas-ask>

<canvas-report data-canvas-id="r-plan"><script type="application/json">{"type": "plan", "title": "Plan: print the bracket", "text": "1. Print 3 bracket variants\n2. Pull-test each to failure"}</script>
<canvas-ask data-canvas-id="a-approve"><script type="application/json">{"form": "approve", "question": "Approve this plan?"}</script></canvas-ask>
</canvas-report>

<canvas-ask data-canvas-id="e-one"><script type="application/json">{"form": "one", "question": "A single option", "options": ["only"]}</script></canvas-ask>
<canvas-ask data-canvas-id="e-key"><script type="application/json">{"question": "Unknown key", "colour": "red"}</script></canvas-ask>
</div></body></html>
