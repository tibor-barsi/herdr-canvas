# Herdr's own navigation keys (read from Herdr's keys.json, 2026-11-22) plus the canvas's own keys.
# Copy this file to the keys folder of your config (e.g. ~/.config/herdr-canvas/keys/mine.toml),
# change what you like and choose it in the ? overview. An action this file does not name
# keeps the key it has in herdr.toml. A key is the browser's key name, with Ctrl+ Alt+ Shift+
# in front (a letter carries its Shift in its case: "Ctrl+B" is Ctrl+Shift+B).
description = "Herdr's navigation keys plus the canvas's own keys"

[keys]
"space.next" = ["Ctrl+Shift+PageDown", "Ctrl+Alt+ArrowDown"]
"space.prev" = ["Ctrl+Shift+PageUp", "Ctrl+Alt+ArrowUp"]
"space.select:1" = ["Ctrl+Alt+1"]
"space.select:2" = ["Ctrl+Alt+2"]
"space.select:3" = ["Ctrl+Alt+3"]
"space.select:4" = ["Ctrl+Alt+4"]
"space.select:5" = ["Ctrl+Alt+5"]
"space.select:6" = ["Ctrl+Alt+6"]
"space.select:7" = ["Ctrl+Alt+7"]
"space.select:8" = ["Ctrl+Alt+8"]
"space.select:9" = ["Ctrl+Alt+9"]
"machine.fold" = ["Alt+f"]
"tab.next" = ["Ctrl+PageDown", "Ctrl+Tab", "Alt+]", "Ctrl+Alt+ArrowRight"]
"tab.prev" = ["Ctrl+PageUp", "Ctrl+Shift+Tab", "Alt+[", "Ctrl+Alt+ArrowLeft"]
"tab.select:1" = ["Alt+1", "Ctrl+1"]
"tab.select:2" = ["Alt+2", "Ctrl+2"]
"tab.select:3" = ["Alt+3", "Ctrl+3"]
"tab.select:4" = ["Alt+4", "Ctrl+4"]
"tab.select:5" = ["Alt+5", "Ctrl+5"]
"tab.select:6" = ["Alt+6", "Ctrl+6"]
"tab.select:7" = ["Alt+7", "Ctrl+7"]
"tab.select:8" = ["Alt+8", "Ctrl+8"]
"tab.select:9" = ["Alt+9", "Ctrl+9"]
"pane.go:left" = ["Alt+h", "Alt+ArrowLeft"]
"pane.go:right" = ["Alt+l", "Alt+ArrowRight"]
"pane.go:up" = ["Alt+k", "Alt+ArrowUp"]
"pane.go:down" = ["Alt+j", "Alt+ArrowDown"]
"pane.prev" = ["["]
"pane.next" = ["]"]
"page.prev" = ["Alt+,"]
"page.next" = ["Alt+."]
"sidebar.toggle" = ["Ctrl+B", "b", "B"]
"help.open" = ["?", "Ctrl+?"]
"send.now" = ["Ctrl+Enter"]
"contents.open" = ["o", "O"]
"file.open" = ["Alt+o"]
"notice.reload" = ["Alt+r"]
"update.reload" = ["Alt+u"]
"update.cancel" = ["Alt+U"]
"changes.dismiss" = ["Alt+d"]
"asks.focus" = ["Alt+a"]
"comment.toggle" = ["c", "C"]
"comment.next" = ["j"]
"comment.prev" = ["k"]
"comment.done" = ["x", "X"]
"comment.reply" = ["a"]
"comment.edit" = ["e"]
"comment.delete" = ["Delete"]
"comment.fold" = ["f"]
"comment.foldall" = ["F"]
"comment.filter" = ["v"]
"comment.panel" = ["m"]
"comment.text" = ["t", "T"]
"comment.point" = ["p", "P"]
"comment.rect" = ["r", "R"]
"comment.lasso" = ["l", "L"]
"comment.cursor" = ["Enter"]
"comment.cursor.left" = ["ArrowLeft", "Shift+ArrowLeft"]
"comment.cursor.right" = ["ArrowRight", "Shift+ArrowRight"]
"comment.cursor.up" = ["ArrowUp", "Shift+ArrowUp"]
"comment.cursor.down" = ["ArrowDown", "Shift+ArrowDown"]
"comment.cursor.finish" = ["Shift+Enter"]
"comment.leave" = ["Escape"]
"contents.next" = ["j", "ArrowDown"]
"contents.prev" = ["k", "ArrowUp"]
"contents.close" = ["Escape"]
"help.close" = ["Escape"]
"help.up" = ["ArrowUp", "k"]
"help.down" = ["ArrowDown", "j"]
"help.change" = ["Enter"]
"help.add" = ["a"]
"help.reset" = ["r"]
"help.reset.all" = ["R"]
"help.profile.prev" = ["ArrowLeft"]
"help.profile.next" = ["ArrowRight"]
